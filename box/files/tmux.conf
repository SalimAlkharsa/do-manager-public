# =============================================================================
# GENERAL
# =============================================================================

# Enable mouse control:
# - Click windows in the status bar
# - Click/select panes
# - Resize panes with the mouse
# - Scroll through terminal history
set -g mouse on

# Keep window numbers stable when windows are closed.
set -g renumber-windows off


# =============================================================================
# STATUS BAR
# =============================================================================

# Show a visual indicator when Ctrl-b is active, plus the current time.
set -g status-right '#{?client_prefix,#[bg=red] #[fg=white] PREFIX ACTIVE #[bg=default]#[fg=default],} %H:%M '

# Show window number and name in the status bar.
set -g status-left-length 0
set -g window-status-format ' #I:#W '
set -g window-status-current-format ' #[reverse]#I:#W#[default] '


# =============================================================================
# WINDOW NAMING
# =============================================================================

# Keep window names under manual control.
#
# Rename a window with:
#   Ctrl-b ,
#
# This is useful when running multiple terminal agents because each window
# can have a stable name describing what it is being used for.
set -g automatic-rename off


# =============================================================================
# INTERACTIVE WINDOW INDEX
# =============================================================================

# Ctrl-b w opens tmux's interactive session/window/pane tree.
#
# With mouse mode enabled, entries can be clicked directly.
# This is useful when many windows are running simultaneously.
bind w choose-tree -Zw


# =============================================================================
# PANE NAVIGATION
# =============================================================================

# Vim-style pane movement.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R


# =============================================================================
# SPLITS
# =============================================================================

# Easier horizontal / vertical splits.
bind | split-window -h
bind - split-window -v

# Don't resize panes aggressively when terminal dimensions change.
setw -g aggressive-resize off


# =============================================================================
# CLIPBOARD
# =============================================================================

# Allow tmux to synchronize clipboard operations with the local machine.
set -g set-clipboard on

# Pass clipboard escape sequences correctly for xterm-256color.
set -ga terminal-overrides ',xterm-256color\:Ms=\E]52;c;%p2%s\7'


# =============================================================================
# CONFIG RELOAD
# =============================================================================

# Reload this configuration without restarting tmux.
#
# Existing sessions, windows, panes, and running processes are untouched.
#
# Usage:
#   Ctrl-b r
#
# This config is installed to /etc/tmux.conf by box/provision.sh, so the
# reload sources that path rather than ~/.tmux.conf.
bind r source-file /etc/tmux.conf \; display-message "tmux.conf reloaded"
